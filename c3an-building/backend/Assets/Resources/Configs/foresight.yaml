# Foresight training config
# Parameters consumed by Code/Agents/foresight_agent/agent.py (train)

# ---- data ----
production_csv: Data/Primary/foresight_test_production.csv
process_csv: Data/Primary/foresight_test_process.csv

# ---- features ----
seq_feature_cols:
  - Yeast - BRD
  - Yeast - BRN
  - Yeast - FMX
exog_feature_cols:
  - Yeast - BRD_VYA
  - Yeast - BRN_VYA
  - Yeast - FMX_VYA
  - Yeast - BRD_RawYeast
  - Yeast - BRN_RawYeast
  - Yeast - FMX_RawYeast
  - Yeast - BRD_IS/TS
  - Yeast - BRN_IS/TS
  - Yeast - FMX_IS/TS
label_cols:
  - Yeast - BRD
  - Yeast - BRN
  - Yeast - FMX

# ---- preprocessing ----
look_back: 30
time_floor: h
datetime_format: "%d/%m/%Y %H:%M:%S"

# ---- model ----
model_cfg:
  input_dim: 3
  hidden_dim: 64
  num_layers: 2
  out_dim: 3
  dropout: 0.0
  exog_dim: 9

# ---- training ----
train_cfg:
  epochs: 50
  batch_size: 1
  lr: 0.001
  seed: 42
  shuffle: false
  train_ratio: 0.8

# ---- outputs ----
output_dir: Code/Agents/foresight_agent/saved_models

# ---- inference ----
infer:
  production_csv: Data/Primary/foresight_test_production.csv
  process_csv: Data/Primary/foresight_test_process.csv
  model_path: backend/Agents/foresight_agent/saved_models/foresight_lstm_model.pth
  out_csv: backend/Agents/foresight_agent/saved_models/foresight_infer_predictions.csv